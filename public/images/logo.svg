<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <!-- 品牌渐变 -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- 光晕效果 -->
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(79, 70, 229, 0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- 脉冲图标 -->
  <g transform="translate(10, 10)">
    <!-- 光晕背景 -->
    <circle cx="20" cy="20" r="28" fill="url(#glowEffect)"/>
    <!-- 脉冲波形 -->
    <path d="M0 20 Q6 6 12 20 Q18 34 24 20 Q30 6 36 20 Q42 34 48 20" 
          stroke="url(#brandGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 中心圆点——脉搏核心 -->
    <circle cx="24" cy="20" r="4" fill="url(#brandGradient)"/>
  </g>

  <!-- 品牌文字 DreamPulse -->
  <text x="72" y="38" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F1F5F9">
    Dream
    <tspan fill="url(#brandGradient)">Pulse</tspan>
  </text>
</svg>
