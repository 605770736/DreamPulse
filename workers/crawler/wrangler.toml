# DreamPulse 爬虫 Worker 配置
# 由 Cloudflare Cron Triggers 每30分钟触发

name = "dreampulse-crawler"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cron Trigger —— 每30分钟执行一次
[triggers]
crons = ["*/30 * * * *"]

# D1 数据库绑定（与主站共享同一数据库）
[[d1_databases]]
binding = "DB"
database_name = "dreampulse-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 存储桶绑定（封面图上传）
[[r2_buckets]]
binding = "R2"
bucket_name = "dreampulse-media"

# 环境变量
[vars]
OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"
OPENAI_MODEL = "gpt-4o-mini"
OPENAI_BASE_URL = "https://api.openai.com/v1"
SITE_URL = "https://dreampulse.app"
# 爬取超时（毫秒）
FETCH_TIMEOUT = "15000"
# 单次爬取最大文章数
MAX_ARTICLES_PER_SOURCE = "20"
